<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebGather 采集工作流 - 更新页</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
:root {
  --page-bg:#f4f7fb; --panel-bg:#fff; --border:#dce5f1; --border-strong:#cbd7e6;
  --primary:#2563eb; --primary-hover:#1d4ed8; --primary-light:#eef4ff;
  --text-main:#172033; --text-muted:#69758a; --danger:#dc2626;
  --success:#16a34a; --soft:#f8fafc; --log-bg:#020817;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text-main);background:var(--page-bg)}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;flex-direction:column;padding:20px}
.update-panel{min-width:0;background:var(--panel-bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(15,23,42,.035);padding:24px 30px;max-width:440px;width:100%}
p{margin:4px 0 0;color:var(--text-muted);font-size:11px;line-height:1.5}
.version-box{margin-top:16px;background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.version-label{font-size:11px;color:var(--text-muted);font-weight:600}
.version-number{margin-top:4px;font-size:24px;font-weight:bold;color:var(--text-main)}
.version-number.error{color:var(--danger)}
.btn-download{width:100%;border:1px solid transparent;border-radius:7px;height:40px;padding:0 11px;cursor:pointer;transition:.15s;background:var(--primary);color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:16px;gap:8px}
.btn-download:hover:not(:disabled){background:var(--primary-hover)}
.btn-download:disabled{opacity:.45;cursor:not-allowed;background:var(--border-strong);color:var(--text-muted)}
.footer{margin-top:16px;font-size:10px;color:var(--text-muted);text-align:center}
</style>
</head>
<body>

<div class="update-panel">
    <div class="version-box">
        <div class="version-label">最新发布版本</div>
        <div class="version-number" id="versionDisplay">正在获取...</div>
    </div>

    <button class="btn-download" id="downloadBtn" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        下载并安装
    </button>
    <p class="footer">下载完成后，双击安装包即可自动升级</p>
</div>

<script>
(async function() {
    const versionEl = document.getElementById('versionDisplay');
    const downloadBtn = document.getElementById('downloadBtn');
    const BASE_URL = "https://github.com/MAGIGT/vercel_updater/releases/download/v";

    try {
        const response = await fetch('/webgather/windows/latest.yml');
        if (!response.ok) throw new Error('无法加载更新信息');
        
        const data = jsyaml.load(await response.text());
        const version = data.version || '';
        const exeName = data.path || (data.files?.[0]?.url);

        if(!version || !exeName) throw new Error("解析版本信息失败");

        versionEl.innerText = `v${version}`;
        const downloadUrl = `${BASE_URL}${version}/${exeName}`;

        downloadBtn.disabled = false;
        downloadBtn.onclick = function() {
            window.open(downloadUrl, "_blank");
        };
   
    } catch (error) {
        console.error(error);
        versionEl.innerText = '获取更新失败';
        versionEl.classList.add('error');
        downloadBtn.innerText = '暂时无法下载';
        downloadBtn.disabled = true;
    }
})();
</script>

</body>
</html>
