<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>WebGather Product Workflow 更新</title>
  <style>
    :root{--page:#f4f7fb;--panel:#fff;--border:#dce5f1;--primary:#2563eb;--primary-hover:#1d4ed8;--text:#172033;--muted:#69758a;--soft:#f8fafc;--danger:#c62828;--success:#16803c}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--page)}
    body{display:grid;place-items:center;min-height:100vh;padding:24px}.panel{width:min(520px,100%);padding:28px;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 36px rgba(15,23,42,.08)}
    h1{margin:0;font-size:23px;line-height:1.25}.lead{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.65}.version{margin-top:20px;padding:17px;text-align:center;background:var(--soft);border:1px solid var(--border);border-radius:11px}
    .version-label{font-size:12px;color:var(--muted);font-weight:650}.version-number{margin-top:3px;font-size:28px;font-weight:760}.version-number.error{color:var(--danger)}
    .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.meta div{padding:9px 6px;border:1px solid var(--border);border-radius:8px;text-align:center;min-width:0}.meta span{display:block;color:var(--muted);font-size:10px}.meta strong{display:block;margin-top:2px;font-size:12px;overflow-wrap:anywhere}
    .notes{display:none;margin-top:14px;padding:12px 14px;max-height:160px;overflow:auto;white-space:pre-wrap;background:var(--soft);border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:12px;line-height:1.6}.notes.visible{display:block}
    button{font:inherit}.download{width:100%;height:44px;margin-top:17px;border:0;border-radius:9px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}.download:hover:not(:disabled){background:var(--primary-hover)}.download:disabled{cursor:not-allowed;opacity:.52}
    .secondary{display:flex;justify-content:center;gap:14px;margin-top:13px;font-size:12px}.secondary a,.secondary button{padding:0;border:0;background:none;color:var(--primary);text-decoration:none;cursor:pointer}.secondary a:hover,.secondary button:hover{text-decoration:underline}
    .status{min-height:20px;margin-top:13px;text-align:center;color:var(--muted);font-size:11px;line-height:1.55}.status.success{color:var(--success)}.status.error{color:var(--danger)}
    .footer{margin-top:15px;text-align:center;color:var(--muted);font-size:10px;line-height:1.55}
    @media(max-width:430px){.panel{padding:21px}.meta{grid-template-columns:1fr}.meta div{display:flex;justify-content:space-between;text-align:left}}
    @media(prefers-color-scheme:dark){:root{--page:#181a1d;--panel:#1e2024;--border:#353940;--text:#d8dbe1;--muted:#9ba3af;--soft:#25282d;--primary:#388bfd;--primary-hover:#58a6ff}}
  </style>
</head>
<body>
  <main class="panel">
    <h1>WebGather Product Workflow</h1>
    <p class="lead">这里是 WebGather 官方更新页。页面由 koikey.top 提供，安装包直接下载自 GitHub Release。</p>
    <section class="version" aria-live="polite">
      <div class="version-label">最新发布版本</div>
      <div class="version-number" id="version">&mdash;</div>
      <div class="meta" id="meta" hidden>
        <div><span>安装包</span><strong id="fileName">&mdash;</strong></div>
        <div><span>文件大小</span><strong id="fileSize">&mdash;</strong></div>
        <div><span>发布时间</span><strong id="publishedAt">&mdash;</strong></div>
      </div>
    </section>
    <div class="notes" id="notes"></div>
    <button class="download" id="download" disabled>正在获取最新版本…</button>
    <div class="secondary"><button id="retry" type="button">重新获取</button><a id="release" href="https://github.com/MAGIGT/vercel_updater/releases/latest" target="_blank" rel="noopener noreferrer">查看发布详情</a></div>
    <div class="status" id="status">正在连接 GitHub…</div>
    <div class="footer">下载完成后双击 Setup 即可升级。请不要从不明镜像获取安装包。</div>
  </main>
  <script>
    (() => {
      'use strict';
      const metadataUrl = '/webgather/windows/latest.yml';
      const releaseBase = 'https://github.com/MAGIGT/vercel_updater/releases/latest/download/';
      const fallback = 'https://github.com/MAGIGT/vercel_updater/releases/latest';
      const $ = (id) => document.getElementById(id);
      const elements = { version:$('version'), meta:$('meta'), fileName:$('fileName'), fileSize:$('fileSize'), publishedAt:$('publishedAt'), notes:$('notes'), download:$('download'), retry:$('retry'), release:$('release'), status:$('status') };
      let downloadUrl = '';
      const formatBytes = (value) => { const bytes=Number(value||0); if(!bytes)return '未知'; const units=['B','KB','MB','GB']; const index=Math.min(units.length-1,Math.floor(Math.log(bytes)/Math.log(1024))); return `${(bytes/Math.pow(1024,index)).toFixed(index>1?1:0)} ${units[index]}`; };
      const formatDate = (value) => { const date=new Date(value||''); return Number.isNaN(date.getTime())?'未知':new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).format(date); };
      const yamlValue = (source,key) => { const match=String(source||'').match(new RegExp(`^\\s*${key}\\s*:\\s*(.+?)\\s*$`,'mi')); return String(match?.[1]||'').trim().replace(/^['"]|['"]$/g,''); };
      async function loadLatest(){
        downloadUrl=''; elements.version.textContent='…'; elements.version.classList.remove('error'); elements.download.disabled=true; elements.download.textContent='正在获取最新版本…'; elements.status.className='status'; elements.status.textContent='正在连接更新源…'; elements.meta.hidden=true; elements.notes.classList.remove('visible'); elements.notes.textContent='';
        try{
          const response=await fetch(`${metadataUrl}?t=${Date.now()}`,{cache:'no-store'}); if(!response.ok)throw new Error(`更新信息 HTTP ${response.status}`); const metadata=await response.text(); const version=yamlValue(metadata,'version'); const installerName=yamlValue(metadata,'path'); const size=yamlValue(metadata,'size'); const releaseDate=yamlValue(metadata,'releaseDate'); if(!version)throw new Error('latest.yml 中没有版本号'); if(!/^WebGather-Product-Workflow-Setup-.*\.exe$/i.test(installerName))throw new Error('latest.yml 中没有有效安装包路径');
          downloadUrl=`${releaseBase}${encodeURIComponent(installerName)}`; elements.version.textContent=`v${version.replace(/^v/i,'')}`; elements.fileName.textContent=installerName; elements.fileSize.textContent=formatBytes(size); elements.publishedAt.textContent=formatDate(releaseDate); elements.meta.hidden=false; elements.release.href=fallback; elements.download.disabled=false; elements.download.textContent='下载并安装'; elements.status.className='status success'; elements.status.textContent='更新信息已获取；下载文件来自 GitHub Release。';
        }catch(error){elements.version.textContent='获取失败';elements.version.classList.add('error');elements.download.disabled=true;elements.download.textContent='暂时无法下载';elements.status.className='status error';elements.status.textContent=`${error.message||'网络连接失败'}。请重试，或查看发布详情。`;}
      }
      elements.download.addEventListener('click',()=>{if(downloadUrl)window.location.assign(downloadUrl);}); elements.retry.addEventListener('click',loadLatest); loadLatest();
    })();
  </script>
</body>
</html>
